<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed — Obliger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  :root {
    --teal: #0F9B8E;
    --mint: #E6F7F4;
    --text: #0B2B2A;
    --text-muted: #4A6664;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--mint);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(15, 155, 142, 0.12);
  }

  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 28px;
    height: 28px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
  }

  p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 0 0 28px;
  }

  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17L4 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Email Confirmed</h1>
    <p>Your email address has been confirmed.</p>
    <div class="footer">Obliger</div>
  </div>
</body>
</html>
